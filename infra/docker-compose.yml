version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clipsync
      POSTGRES_USER: clipsync
      POSTGRES_PASSWORD: clipsync
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://clipsync:clipsync@postgres:5432/clipsync
      JWT_SECRET: change-me
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      BLOB_STORAGE_PATH: /data/blobs
    volumes:
      - ../blob-storage:/data/blobs
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
